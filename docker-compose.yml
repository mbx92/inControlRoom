services:
  app:
    image: ${COOLIFY_RESOURCE_UUID:-incontrolroom}:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        COOLIFY_FQDN: ${COOLIFY_FQDN:-}
        APP_KEY: ${APP_KEY:-}
        APP_ENV: ${APP_ENV:-production}
        APP_DEBUG: ${APP_DEBUG:-false}
        APP_URL: ${APP_URL:-}
        APP_NAME: ${APP_NAME:-InfraControl}
        APP_LOCALE: ${APP_LOCALE:-en}
        APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
        APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
        APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
        BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
        LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
        LOG_STACK: ${LOG_STACK:-single}
        LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-}
        LOG_LEVEL: ${LOG_LEVEL:-info}
        DB_CONNECTION: ${DB_CONNECTION:-sqlite}
        DB_HOST: ${DB_HOST:-127.0.0.1}
        DB_PORT: ${DB_PORT:-5432}
        DB_DATABASE: ${DB_DATABASE:-}
        DB_USERNAME: ${DB_USERNAME:-}
        DB_PASSWORD: ${DB_PASSWORD:-}
        SESSION_DRIVER: ${SESSION_DRIVER:-database}
        SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
        SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
        SESSION_PATH: ${SESSION_PATH:-/}
        SESSION_DOMAIN: ${SESSION_DOMAIN:-}
        BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
        FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
        QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
        CACHE_STORE: ${CACHE_STORE:-database}
        AUTO_RUN_MIGRATIONS: ${AUTO_RUN_MIGRATIONS:-true}
        MEMCACHED_HOST: ${MEMCACHED_HOST:-127.0.0.1}
        REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
        REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
        REDIS_PASSWORD: ${REDIS_PASSWORD:-}
        REDIS_PORT: ${REDIS_PORT:-6379}
        MAIL_MAILER: ${MAIL_MAILER:-log}
        MAIL_SCHEME: ${MAIL_SCHEME:-}
        MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
        MAIL_PORT: ${MAIL_PORT:-2525}
        MAIL_USERNAME: ${MAIL_USERNAME:-}
        MAIL_PASSWORD: ${MAIL_PASSWORD:-}
        MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
        MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
        AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
        AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
        AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
        AWS_BUCKET: ${AWS_BUCKET:-}
        AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
        VITE_APP_NAME: ${VITE_APP_NAME:-}
        SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        SENTRY_SAMPLE_RATE: ${SENTRY_SAMPLE_RATE:-1.0}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.01}
        SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
        SENTRY_SEND_LOCAL: ${SENTRY_SEND_LOCAL:-false}
        GLITCHTIP_SECURITY_ENDPOINT: ${GLITCHTIP_SECURITY_ENDPOINT:-}
        GLITCHTIP_CSP_REPORT_ONLY: ${GLITCHTIP_CSP_REPORT_ONLY:-true}
        GLITCHTIP_CSP_POLICY: ${GLITCHTIP_CSP_POLICY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0}
        VITE_SENTRY_ENABLED: ${VITE_SENTRY_ENABLED:-true}
        SSH_TERMINAL_PROXY_URL: ${SSH_TERMINAL_PROXY_URL:-}
        QUEUE_WORKER_TRIES: ${QUEUE_WORKER_TRIES:-1}
        QUEUE_WORKER_TIMEOUT: ${QUEUE_WORKER_TIMEOUT:-0}
        QUEUE_WORKER_SLEEP: ${QUEUE_WORKER_SLEEP:-1}
        QUEUE_WORKER_QUEUE: ${QUEUE_WORKER_QUEUE:-default}
        SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-60}
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: app
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_NAME: ${APP_NAME:-InfraControl}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-/var/www/html/storage/app/database/database.sqlite}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      AUTO_RUN_MIGRATIONS: ${AUTO_RUN_MIGRATIONS:-true}
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_SAMPLE_RATE: ${SENTRY_SAMPLE_RATE:-1.0}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.01}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
      SENTRY_SEND_LOCAL: ${SENTRY_SEND_LOCAL:-false}
      GLITCHTIP_SECURITY_ENDPOINT: ${GLITCHTIP_SECURITY_ENDPOINT:-}
      GLITCHTIP_CSP_REPORT_ONLY: ${GLITCHTIP_CSP_REPORT_ONLY:-true}
      GLITCHTIP_CSP_POLICY: ${GLITCHTIP_CSP_POLICY:-}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
      VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0}
      VITE_SENTRY_ENABLED: ${VITE_SENTRY_ENABLED:-true}
      SSH_TERMINAL_PROXY_URL: ${SSH_TERMINAL_PROXY_URL}
      SSH_TERMINAL_PROXY_HEALTH_URL: http://terminal-proxy:8078/healthz
      SSH_TERMINAL_PROXY_MANAGED_EXTERNALLY: "true"
    expose:
      - "8088"
    networks:
      - default
      - coolify
    volumes:
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/up >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  queue:
    image: ${COOLIFY_RESOURCE_UUID:-incontrolroom}:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      CONTAINER_ROLE: queue
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_NAME: ${APP_NAME:-InfraControl}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-/var/www/html/storage/app/database/database.sqlite}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_WORKER_TRIES: ${QUEUE_WORKER_TRIES:-1}
      QUEUE_WORKER_TIMEOUT: ${QUEUE_WORKER_TIMEOUT:-0}
      QUEUE_WORKER_SLEEP: ${QUEUE_WORKER_SLEEP:-1}
      QUEUE_WORKER_QUEUE: ${QUEUE_WORKER_QUEUE:-default}
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    networks:
      - default
      - coolify
    volumes:
      - app-storage:/var/www/html/storage

  scheduler:
    image: ${COOLIFY_RESOURCE_UUID:-incontrolroom}:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      CONTAINER_ROLE: scheduler
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_NAME: ${APP_NAME:-InfraControl}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-/var/www/html/storage/app/database/database.sqlite}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-60}
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    networks:
      - default
      - coolify
    volumes:
      - app-storage:/var/www/html/storage

  terminal-proxy:
    image: ${COOLIFY_RESOURCE_UUID:-incontrolroom}:latest
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: terminal-proxy
      APP_URL: ${APP_URL}
      SSH_TERMINAL_PROXY_HOST: 0.0.0.0
      SSH_TERMINAL_PROXY_PORT: 8078
    expose:
      - "8078"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8078/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default
      - coolify

volumes:
  app-storage:

networks:
  coolify:
    external: true
    name: coolify
