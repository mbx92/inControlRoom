name: windows-agent

on:
  push:
    paths:
      - '.github/workflows/windows-agent.yml'
      - 'agent/**'
      - 'app/Http/Controllers/AgentController.php'
      - 'app/Services/Agent/**'
      - 'config/agent.php'
      - 'config/filesystems.php'
      - 'tests/Feature/AgentApiTest.php'
      - 'tests/Feature/AgentInstallerDownloadTest.php'
  pull_request:
    paths:
      - '.github/workflows/windows-agent.yml'
      - 'agent/**'
      - 'app/Http/Controllers/AgentController.php'
      - 'app/Services/Agent/**'
      - 'config/agent.php'
      - 'config/filesystems.php'
      - 'tests/Feature/AgentApiTest.php'
      - 'tests/Feature/AgentInstallerDownloadTest.php'
  workflow_dispatch:

jobs:
  build-windows-agent:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test agent
        run: pnpm test

      - name: Build release bundle
        run: pnpm run build

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: pnpm run build:installer

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: infracontrol-agent-bundle
          path: agent/dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: infracontrol-agent-installer
          path: agent/dist/installer/InfraControl.Agent.Setup.exe

      - name: Publish installer to MinIO
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        shell: bash
        working-directory: .
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.MINIO_REGION || 'us-east-1' }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          AGENT_INSTALLER_OBJECT_KEY: ${{ vars.AGENT_INSTALLER_OBJECT_KEY || 'agents/InfraControl.Agent.Setup.exe' }}
        run: |
          if [ -z "$MINIO_ENDPOINT" ] || [ -z "$MINIO_BUCKET" ]; then
            echo "MinIO secrets not configured, skipping publish."
            exit 0
          fi

          pip install awscli --quiet
          aws s3 cp "agent/dist/installer/InfraControl.Agent.Setup.exe" "s3://${MINIO_BUCKET}/${AGENT_INSTALLER_OBJECT_KEY}" \
            --endpoint-url "$MINIO_ENDPOINT"
